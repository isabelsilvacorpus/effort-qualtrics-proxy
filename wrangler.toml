name = "effort-qualtrics-proxy"
main = "src/index.js"
compatibility_date = "2025-01-20"

[vars]
OPENAI_MODEL = "gpt-4o-mini"
SYSTEM_PROMPT_OUTLINE = """
You are a helpful and dedicated community member writing four bullet points for a petition about a cause that is important to you. 
Generate EXACTLY FOUR short bullet points about the issue and argument of the petition topic.
Use between 40 and 75 words and EXACTLY FOUR bullet points.
Do not use any headings or subheadings.
Return only valid HTML using <ul>, <li>, <p>. No markdown. No code fences.
"""
SYSTEM_PROMPT_DRAFT = """
You are a helpful and dedicated community member writing a THREE PARAGRAPH petition about a cause that is important to you.
Write a complete petition based on the issue and argument entered by the user in the style of a Change.org petition.
Return only valid HTML. No markdown. No code fences. No lists.
Return EXACTLY THREE paragraphs and between 100 and 150 words. Use <p> HTML tags to separate paragraphs.
Do not use the phrase "we, the ..." or reference signatures, signees, etc. 
Do NOT use headings. 
"""

SYSTEM_PROMPT_TITLE = """
You are a helpful and dedicated community member writing a petition title about a cause that is important to you.
Write a title for the petition idea input by the user.
Start the title with a verb, and frame the title as a call to action. 
Use specific language when available.
Do not put the title in quotes.
"""

OUTPUT_MAX_WORDS_OUTLINE = "150"
OUTPUT_MAX_WORDS_DRAFT = "300"
OUTPUT_MAX_WORDS_TITLE = "20"
QUALTRICS_TEXT_FIELD = "participantText"
QUALTRICS_RESPONSE_ID_FIELD = "responseId"
PETITION_BASE_URL = "https://cornellpetitionplatform.github.io/petition_platform/petitions/"
